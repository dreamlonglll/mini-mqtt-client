[package]
name = "mini-mqtt-client"
version = "2.0.0-pre.2"
edition = "2024"
rust-version = "1.92"
description = "A lightweight MQTT debugging client built with Rust + GPUI Kit"
license = "MIT"
repository = "https://github.com/dreamlonglll/mini-mqtt-client"
build = "build.rs"
default-run = "mini-mqtt-client"

[[bin]]
name = "mini-mqtt-client"
path = "src/main.rs"

[dependencies]
# UI
gpui-kit = { version = "0.8.1", features = ["tree-sitter-javascript"] }

# MQTT
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider", "websocket"] }
# Use the `ring` crypto provider (same as GPUI) instead of aws-lc, which needs cmake/NASM.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
# Encrypted (PKCS#8) client keys; pure RustCrypto, like the crates below.
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures = "0.3"

# Script engine (pure Rust JavaScript engine)
boa_engine = "0.21"

# Crypto helpers exposed to scripts
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
base64 = "0.22"
crc32fast = "1"
rand = "0.8"
hex = "0.4"
# gzip / zlib for scripts; pure Rust backend, already in the tree via GPUI.
flate2 = "1"

# Localisation: rust-i18n is what GPUI Kit's components use, so one locale
# switch covers the app and the components; sys-locale reads the OS language.
rust-i18n = "4"
sys-locale = "0.3"

# Storage & misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
dirs = "6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
# Keep debug builds snappy: optimize dependencies, not our own crate.
opt-level = 0

[profile.dev.package."*"]
opt-level = 1

# 错误处理相关文案（工具模块在调用时取值，跟随当前语言）
errorTypes:
  network: 网络错误
  mqtt: MQTT 错误
  database: 数据库错误
  validation: 验证错误
  script: 脚本错误
  unknown: 错误

mqttErrors:
  connectionRefused:
    message: 连接被拒绝
    suggestion: 请检查服务器地址和端口是否正确
  connectionTimeout:
    message: 连接超时
    suggestion: 请检查网络连接或服务器是否可用
  authFailed:
    message: 认证失败
    suggestion: 请检查用户名和密码是否正确
  badCredentials:
    message: 用户名或密码错误
    suggestion: 请检查用户名和密码是否正确
  notAuthorized:
    message: 未授权
    suggestion: 当前用户没有该操作权限
  topicInvalid:
    message: 主题格式无效
    suggestion: 请检查主题格式是否符合 MQTT 规范
  payloadTooLarge:
    message: 消息体过大
    suggestion: 请减小消息体大小
  packetTooLarge:
    message: 消息包过大
    suggestion: 请减小消息体大小
  disconnected:
    message: 连接已断开
    suggestion: 请重新连接服务器
  network:
    message: 网络错误
    suggestion: 请检查网络连接是否正常
  io:
    message: IO 错误
    suggestion: 请检查网络连接或重试
  brokerUnavailable:
    message: 服务器不可用
    suggestion: 请检查服务器是否正常运行
  invalidClientId:
    message: Client ID 无效
    suggestion: 请检查 Client ID 格式是否正确
  protocol:
    message: 协议错误
    suggestion: 请检查 MQTT 协议版本是否匹配
  unknownSuggestion: 请查看详细日志获取更多信息


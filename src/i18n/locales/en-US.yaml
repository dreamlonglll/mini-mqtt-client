# Wording used by utility modules (resolved at call time so it follows the current locale)
errorTypes:
  network: Network Error
  mqtt: MQTT Error
  database: Database Error
  validation: Validation Error
  script: Script Error
  unknown: Error

mqttErrors:
  connectionRefused:
    message: Connection refused
    suggestion: Check that the broker host and port are correct
  connectionTimeout:
    message: Connection timed out
    suggestion: Check your network connection or whether the broker is reachable
  authFailed:
    message: Authentication failed
    suggestion: Check that the username and password are correct
  badCredentials:
    message: Bad username or password
    suggestion: Check that the username and password are correct
  notAuthorized:
    message: Not authorized
    suggestion: The current user is not allowed to perform this operation
  topicInvalid:
    message: Invalid topic format
    suggestion: Check that the topic conforms to the MQTT specification
  payloadTooLarge:
    message: Payload too large
    suggestion: Reduce the payload size
  packetTooLarge:
    message: Packet too large
    suggestion: Reduce the payload size
  disconnected:
    message: Disconnected
    suggestion: Reconnect to the broker
  network:
    message: Network error
    suggestion: Check that the network connection is working
  io:
    message: IO error
    suggestion: Check the network connection or try again
  brokerUnavailable:
    message: Broker unavailable
    suggestion: Check that the broker is running
  invalidClientId:
    message: Invalid Client ID
    suggestion: Check that the Client ID format is correct
  protocol:
    message: Protocol error
    suggestion: Check that the MQTT protocol version matches
  unknownSuggestion: See the detailed log for more information

scriptErrors:
  executeFailed: "Script execution failed [{name}]: {reason}"
  syntaxError: Script syntax error
  importWarningTitle: Import External Script
  importWarningMessage: An external script can use every capability of this app (including network and file access). Make sure you trust its source before importing.
  importWarningConfirm: Import anyway
